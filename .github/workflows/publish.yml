name: Publish due posts

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min around the clock; only rows that are due are ever posted
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# One writer to queue.csv at a time, shared with the planner and watchdog.
concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the test suite imports
        run: pip install pillow numpy
      - name: Run tests first (a broken publisher must never post)
        run: python -m unittest discover -s tests
      # Reads config/control.json: mode off or paused => does nothing; shadow => dry run; live => posts.
      - name: Post the next due, approved row (if the control file allows it)
        id: post
        run: python publisher/publish.py
      - name: Save queue changes (retries if the branch moved)
        if: always()
        run: |
          git config user.name "ig-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.csv
          git diff --cached --quiet && exit 0
          git commit -m "queue: update post status"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "could not push queue.csv" >&2; exit 1
      - name: Alert me when posting failed
        if: failure() && steps.post.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one open alert at a time, so a repeating failure never floods the issue list
          [ "$(gh issue list --state open --search 'Instagram post failed in:title' --json number -q length)" = "0" ] || exit 0
          gh issue create --title "Instagram post failed" \
            --body "The publisher reported an error. See queue.csv (status=error, result column) and the run log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. A common cause is an expired IG_TOKEN. The watchdog pauses posting by itself after repeated failures."
