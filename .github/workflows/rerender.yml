name: Re-render slides (after a design change)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Post ids to re-render, comma separated (for example 008,009,010)"
        required: true

permissions:
  contents: write

concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  rerender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/media
      RERENDER: ${{ github.event.inputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Run tests first
        run: python -m unittest discover -s tests
      - name: Re-render the slides (photos from Wikimedia Commons and NASA, no AI)
        run: python agents/render_slides.py
      - name: Save
        run: |
          git config user.name "ig-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.csv content media
          git diff --cached --quiet && exit 0
          git commit -m "slides: re-rendered with photos"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
          echo "could not push" >&2; exit 1
