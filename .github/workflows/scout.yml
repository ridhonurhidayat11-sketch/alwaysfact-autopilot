name: Scout (daily candidate topics, no AI)

on:
  schedule:
    - cron: "47 3,9,15,21 * * *"   # 10:47, 16:47, 22:47, 04:47 WIB: fresh news 20 minutes before each Claude routine run (minute 47 avoids the busy :00/:30)
  workflow_dispatch: {}
  # Woken by the Claude routine "tick" (pushes an empty claude/tick-* branch): GitHub cron proved unreliable here.
  push:
    branches: ["claude/tick-**"]

permissions:
  contents: write

concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # a tick branch only wakes this workflow up; the data always lives on main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch real science feeds and store the article text (plain code, no AI, no cost)
        run: python agents/pipeline.py scout
      - name: Save candidates (a daily commit also keeps the repo active so GitHub never pauses the schedules)
        run: |
          git config user.name "ig-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state/candidates.json state/sources
          git diff --cached --quiet && exit 0
          git commit -m "scout: today's candidate topics"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
          echo "could not push candidates" >&2; exit 1
